name: Sync from xl300-dds-v2

# Polls xl300-dds-v2 for a newer tag than the one currently pinned. If found:
# bump the submodule -> regenerate via the real fastddsgen (inside
# docker.io/umeshwalkar/xl300-dev-base:0.1.0, built by that repo's own CI) ->
# build-verify the result actually compiles -> open a PR with the bump +
# regenerated code together, for a human glance before it lands. Never commits
# anything that failed to build -- same discipline this repo's history was
# built on by hand (see README.md's "Real bug this design already caught").
#
# Push-triggered via repository_dispatch: xl300-dds-v2's own
# notify-uuv-interfaces.yml fires an "xl300-dds-v2-tagged" event here the
# moment it tags, using a fine-grained PAT scoped only to this repo. The
# schedule below stays as a fallback net in case that dispatch call ever fails
# silently (token expiry, API hiccup, etc) -- without it, a dropped dispatch
# would mean this repo silently drifts from the contract until someone notices.

on:
  schedule:
    - cron: "0 */6 * * *"   # fallback net, not the primary trigger
  repository_dispatch:
    types: [xl300-dds-v2-tagged]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uuv_interfaces (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Check for a newer xl300-dds-v2 tag
        id: check
        working-directory: xl300-dds-v2
        run: |
          set -euo pipefail
          git fetch --tags origin
          LATEST_TAG="$(git tag --sort=-v:refname | head -1)"
          if [ -z "${LATEST_TAG}" ]; then
            echo "FATAL: xl300-dds-v2 has no tags at all" >&2
            exit 1
          fi
          LATEST_COMMIT="$(git rev-list -n 1 "${LATEST_TAG}")"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          if [ "${LATEST_COMMIT}" = "${CURRENT_COMMIT}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodule to latest tag
        if: steps.check.outputs.up_to_date == 'false'
        working-directory: xl300-dds-v2
        run: git checkout "${{ steps.check.outputs.latest_tag }}"

      - name: Regenerate + build-verify inside xl300-dev-base
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            docker.io/umeshwalkar/xl300-dev-base:0.1.0 \
            bash -c "set -euo pipefail; chmod +x ./gen.sh && ./gen.sh && \
                     cmake -B build -DCMAKE_BUILD_TYPE=Release && \
                     cmake --build build -j\$(nproc)"
          # A non-zero exit here (gen.sh failure, or a build error -- e.g. the
          # kind of fastddsgen quirk this repo has already hit twice) fails the
          # whole job before the PR step ever runs. No half-working code lands.

      - name: Open PR with the bump + regenerated code
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Bump xl300-dds-v2 to ${{ steps.check.outputs.latest_tag }}, regenerate"
          title: "Bump xl300-dds-v2 to ${{ steps.check.outputs.latest_tag }}"
          body: |
            Automated by `sync-contract.yml`: `xl300-dds-v2` has a new tag
            (`${{ steps.check.outputs.latest_tag }}`) that isn't pinned here yet.

            The submodule was bumped to that tag and `generated/` was
            regenerated + build-verified (`cmake --build`) inside
            `docker.io/umeshwalkar/xl300-dev-base:0.1.0` before this PR was opened
            -- this only reaches you because the build actually succeeded.

            Check the linked contract diff before merging, then bump every
            consuming app's `uuv_interfaces` submodule pointer separately
            (this PR does not do that for you).
          branch: bump-xl300-dds-v2-${{ steps.check.outputs.latest_tag }}
          add-paths: |
            xl300-dds-v2
            generated
          labels: |
            automated
            contract-bump
